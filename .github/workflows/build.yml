name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Start production server
        run: |
          npm run start > /tmp/cbam-next.log 2>&1 &
          echo $! > /tmp/cbam-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cbam-next.log
          exit 1
      - name: Smoke test professional PDF API
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/cbam-report.pdf -w "%{http_code}"             -X POST http://127.0.0.1:3000/api/reports/generate             -H "Content-Type: application/json"             --data '{"product":"Aluminium foil","cn":"7607","country":"China","quantity":"100 tonnes","emissions":"Available","status":"covered","classification":"7607","sector":"Aluminium","gas":"CO2"}')
          echo "PDF API HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "PDF API returned non-200 response:"
            cat /tmp/cbam-report.pdf || true
            echo
            echo "Next.js server log:"
            cat /tmp/cbam-next.log || true
            exit 1
          fi
          signature=$(head -c 5 /tmp/cbam-report.pdf)
          size=$(wc -c < /tmp/cbam-report.pdf)
          echo "PDF signature: $signature"
          echo "PDF bytes: $size"
          if [ "$signature" != "%PDF-" ]; then
            echo "Response is not a valid PDF header."
            head -c 500 /tmp/cbam-report.pdf || true
            exit 1
          fi
          if [ "$size" -le 1000 ]; then
            echo "PDF is unexpectedly small."
            exit 1
          fi
          file /tmp/cbam-report.pdf
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/cbam-next.pid ]; then kill "$(cat /tmp/cbam-next.pid)" || true; fi
